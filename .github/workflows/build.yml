name: bluebuild
on:
  schedule:
    - cron:
        "00 07 * * 5" # build at 07:00 UTC (80 minutes after last ublue images start building), every Friday, rpm-ostreed timer set at first Saturday of month
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe-wayblue-sway-nvidia-closed.yml
          - recipe-wayblue-hyprland-nvidia-closed.yml
          # - recipe-secureblue-sway-nvidia-closed.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          maximize_build_space: true
          #rechunk: true\
          build_chunked_oci: true
          build_opts: --compression-format zstd --build-driver buildah
