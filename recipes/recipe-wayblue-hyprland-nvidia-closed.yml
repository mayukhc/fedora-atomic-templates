# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: wayblue-hyprland-nvidia-trimmed
description: Trimmed wayblue, some additions.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/hyprland-nvidia
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: script
    snippets:
      - "rpm -e --nopostun --nodeps docbook-dtds" # Package downgraded to weak dependancy in firefox-154.0.5/downstream/wayblue-hyprland, postun sript failing and blocking build.
      - "rpm -e --nopostun --nodeps qt" # Similar issue

  - type: dnf
    repos:
      copr:
        - atim/starship
        - alternateved/eza
        - codifryed/CoolerControl 
        - zeno/scrcpy 
        - lihaohong/yazi
      files:
        - https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo 
    install:
      install-weak-deps: false
      packages:
        - alacritty
        - bat
        - btop
        - btrfs-assistant
        - conda
        - coolercontrold # Daemon plus web UI for thermal management across all devices
        - drm_info
        - eza
        - flatpak-spawn
        - fd-find
        - https://cdn.filen.io/@filen/desktop/release/latest/Filen_linux_x86_64.rpm
        - fish
        - greetd

        # Hyprland 
        - hyprlauncher
        - hyprpolkitagent 
        - hyprpwcenter
        - hyprshutdown
        - hyprsunset
        - hyprsysteminfo
        - hyprqt6engine

        - intel-vaapi-driver
        - lshw # System info utility
        - keychain
        - keepassxc 
        - langpacks-bn # Bengali fonts + locale + IM
        - libratbag-ratbagd # View, cotrol wireless mouse. 
        - libva-utils
        - liquidctl # Driver for AIO
        - lm_sensors
        - ncdu
        - neovim
        - nvidia-container-toolkit 
        - nvtop
        - pinentry-qt6
        - podman-docker
        - podman-compose
        - rclone
        - ripgrep
        - scrcpy # Interface with android over adb. 
        - smartmontools # SMART utils for disks
        - snapper
        - starship
        - tmux
        - tuigreet # Console greeter for greetd
        - v4l-utils # Edid-decode for display
        - https://deploy.totallyacdn.com/desktop-apps/2.24.12/windscribe_2.24.12_amd64_fedora.rpm
        - yazi # fast TUI file explorer
    
    remove:
      auto-remove: true
      packages:
        ## Wayblue
  
        # hyprland-modules.yml
        - kitty

        # sddm-modules.yml
        - sddm
        - sddm-themes
        - qt5-qtgraphicaleffects
        - qt5-qtquickcontrols2
        - qt5-qtsvg
        - kwallet
        - pam-kwallet

        # common-modules.yml
        - rofi-wayland
        - wlsunset #Not supported in hyprland
  
        ## Fedora atomic images
  
        # Fedora-specific packages 
        - fedora-bookmarks
        - fedora-chromium-config
        - fedora-flathub-remote
        - fpaste
  
        # Unneeded fonts, ibus engines
        - default-fonts-cjk-mono
        - default-fonts-cjk-sans
        - default-fonts-cjk-serif
        - ibus-anthy
        - ibus-anthy-python
        - ibus-hangul
        - ibus-libpinyin
        - ibus-chewing
  
        # Misc
        - brltty
        - orca
        - firefox
        - firefox-langpacks
        - toolbox # using distrobox
        - spice-webdavd
        - spice-vdagent

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  - type: systemd 
    system:
      enabled:
        - nvidia-cdi-refresh 

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  - type: initramfs
